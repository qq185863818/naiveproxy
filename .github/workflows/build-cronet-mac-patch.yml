name: Build Patched Cronet macOS Static Library

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-patched-cronet-macos-static
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: src

jobs:
  macos:
    name: Build patched Cronet macOS ${{ matrix.arch }} static library
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    env:
      EXTRA_FLAGS: 'target_cpu="${{ matrix.arch }}" enable_websockets=true'
      TARGET_CPU: ${{ matrix.arch }}
      NAIVE_ROOT: ..
      CHROMIUM_SRC: .
      OUT_DIR: out/Release
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout naiveproxy source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install macOS build dependencies
        run: |
          set -euxo pipefail
          brew install ninja ccache
          pip install setuptools
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path
          ninja --version

      - name: Apply and verify Chromium 150 Cronet patch
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail
          test "$(tr -d '\n' < CHROMIUM_VERSION)" = "150.0.7871.63"
          test -f src/DEPS
          git apply --check --whitespace=nowarn \
            patches/cronet/cronet-v150-cycronet-features.patch
          git apply --whitespace=nowarn \
            patches/cronet/cronet-v150-cycronet-features.patch
          grep -Fq 'Cronet_WebSocket_Connect' \
            src/components/cronet/native/include/cronet_websocket_c.h
          grep -Fq 'static_library("cronet_static")' \
            src/components/cronet/BUILD.gn

      - name: Cache macOS toolchain and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/chrome/build/pgo_profiles/chrome-mac-*
            src/gn/
            .ccache/
          key: cronet-macos-patch-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION', 'src/DEPS', 'patches/cronet/cronet-v150-cycronet-features.patch') }}-v1

      - name: Prepare macOS repository toolchain
        run: |
          set -euxo pipefail
          chmod +x ./get-clang.sh ./get-sysroot.sh ./build.sh
          chmod +x \
            ./build/toolchain/apple/linker_driver.py \
            ./build/toolchain/apple/filter_libtool.py \
            ./build/toolchain/apple/swiftc.py \
            ./build/toolchain/apple/compile_xcassets.py
          bash ./get-clang.sh
          clang_bin=./third_party/llvm-build/Release+Asserts/bin

          link_apple_tool() {
            local bundled_name="$1"
            shift
            if [[ -x "$clang_bin/$bundled_name" ]]; then
              return 0
            fi
            local candidate tool_path
            for candidate in "$@"; do
              if tool_path="$(xcrun --sdk macosx --find "$candidate" 2>/dev/null)" \
                && [[ -x "$tool_path" ]]; then
                ln -sf "$tool_path" "$clang_bin/$bundled_name"
                return 0
              fi
            done
            echo "ERROR: Could not provide $bundled_name"
            return 1
          }

          link_apple_tool llvm-otool otool
          link_apple_tool llvm-nm llvm-nm nm
          link_apple_tool llvm-strip llvm-strip strip
          link_apple_tool llvm-install-name-tool llvm-install-name-tool install_name_tool
          chmod +x ./gn/out/gn \
            ./third_party/llvm-build/Release+Asserts/bin/clang \
            ./third_party/llvm-build/Release+Asserts/bin/clang++
          test -x ./gn/out/gn
          test -x ./third_party/llvm-build/Release+Asserts/bin/clang++

      - name: Build patched Cronet macOS static library
        run: |
          set -euxo pipefail
          ccache -z
          bash ./build.sh
          ninja -C "$OUT_DIR" cronet_static
          ccache -s

      - name: Package and validate patched Cronet macOS static library
        run: |
          set -euxo pipefail
          artifact_dir="$NAIVE_ROOT/cronet-artifact-macos-$TARGET_CPU-patched-static"
          mkdir -p "$artifact_dir"
          found="$(find "$OUT_DIR" -type f \( \
            -name 'libcronet_static.a' -o -name 'cronet_static.a' \
          \) -print -quit || true)"
          if [[ -z "$found" ]]; then
            echo 'ERROR: No Cronet macOS static library was produced.'
            find "$OUT_DIR" -type f -name '*.a' -print | head -200 || true
            exit 1
          fi
          cp -L "$found" "$artifact_dir/libcronet.a"
          cp -L "$OUT_DIR/args.gn" "$artifact_dir/args.gn"
          file "$artifact_dir/libcronet.a"
          ar t "$artifact_dir/libcronet.a" | grep -E \
            'cronet|ssl_client_socket|socks5_client_socket|cronet_websocket' \
            | head -40
          shasum -a 256 "$artifact_dir/libcronet.a" \
            | tee "$artifact_dir/SHA256SUMS.txt"
          {
            echo "naiveproxy revision: $(git -C "$NAIVE_ROOT" rev-parse HEAD)"
            echo "Chromium version: $(tr -d '\n' < "$NAIVE_ROOT/CHROMIUM_VERSION")"
            echo "Target OS: macos"
            echo "Target CPU: $TARGET_CPU"
            echo "GN target: //components/cronet:cronet_static"
            echo "Patch: patches/cronet/cronet-v150-cycronet-features.patch"
            echo "Source library: $found"
          } > "$artifact_dir/build-info.txt"

      - name: Upload patched Cronet macOS static library
        uses: actions/upload-artifact@v4
        with:
          name: cronet-macos-${{ matrix.arch }}-patched-static
          path: cronet-artifact-macos-${{ matrix.arch }}-patched-static
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
