name: Build modified Cronet macOS static library

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-modified-cronet-macos
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: src

jobs:
  macos:
    name: Build modified Cronet macOS ${{ matrix.arch }} static library
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    env:
      EXTRA_FLAGS: 'target_cpu="${{ matrix.arch }}"'
      TARGET_OS: mac
      TARGET_CPU: ${{ matrix.arch }}
      NAIVE_ROOT: ..
      CHROMIUM_SRC: .
      OUT_DIR: out/Release
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout modified naiveproxy source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install macOS build dependencies
        run: |
          set -euxo pipefail
          brew install ninja ccache
          pip install setuptools
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path
          ninja --version
          ccache --version

      - name: Cache macOS toolchain and PGO
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/chrome/build/pgo_profiles/chrome-mac-*
            src/gn/
          key: cronet-macos-toolchain-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION', 'src/DEPS') }}-v1

      - name: Cache macOS compiler output
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: cronet-macos-ccache-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION', 'src/DEPS', 'src/build.sh', 'src/components/cronet/BUILD.gn') }}-${{ github.run_id }}
          restore-keys: |
            cronet-macos-ccache-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION', 'src/DEPS', 'src/build.sh', 'src/components/cronet/BUILD.gn') }}-

      - name: Verify modified Cronet macOS target
        run: |
          set -euxo pipefail
          test -f "$NAIVE_ROOT/CHROMIUM_VERSION"
          test -f "$CHROMIUM_SRC/components/cronet/BUILD.gn"
          grep -Fq 'static_library("cronet_static")' \
            "$CHROMIUM_SRC/components/cronet/BUILD.gn"
          git -C "$NAIVE_ROOT" rev-parse HEAD
          printf 'Chromium version: '
          tr -d '\n' < "$NAIVE_ROOT/CHROMIUM_VERSION"
          printf '\n'

      - name: Prepare macOS repository toolchain
        run: |
          set -euxo pipefail
          chmod +x ./get-clang.sh ./get-sysroot.sh ./build.sh
          bash ./get-clang.sh
          chmod +x ./gn/out/gn \
            ./third_party/llvm-build/Release+Asserts/bin/clang \
            ./third_party/llvm-build/Release+Asserts/bin/clang++
          test -x ./gn/out/gn
          test -x ./third_party/llvm-build/Release+Asserts/bin/clang
          test -x ./third_party/llvm-build/Release+Asserts/bin/clang++
          ./gn/out/gn --version
          ./third_party/llvm-build/Release+Asserts/bin/clang --version

      - name: Build modified Cronet macOS static library
        run: |
          set -euxo pipefail
          ccache -z
          bash ./build.sh
          ninja -C "$OUT_DIR" cronet_static
          ccache -s

      - name: Package and validate Cronet macOS static library
        run: |
          set -euxo pipefail
          artifact_dir="$NAIVE_ROOT/cronet-artifact-macos-$TARGET_CPU"
          mkdir -p "$artifact_dir"

          found="$(find "$OUT_DIR" -type f \( \
            -name 'libcronet_static.a' -o \
            -name 'cronet_static.a' \
          \) -print -quit || true)"

          if [[ -z "$found" ]]; then
            echo 'ERROR: No Cronet macOS static library was produced.'
            find "$OUT_DIR" -type f -name '*.a' -print | head -200 || true
            exit 1
          fi

          echo "Found: $found"
          cp -L "$found" "$artifact_dir/libcronet_static.a"
          cp -L "$OUT_DIR/args.gn" "$artifact_dir/args.gn"

          file_output="$(file "$artifact_dir/libcronet_static.a")"
          echo "$file_output"
          case "$TARGET_CPU" in
            x64) expected='x86_64' ;;
            arm64) expected='arm64' ;;
            *) echo "Unsupported macOS target CPU: $TARGET_CPU"; exit 1 ;;
          esac
          lipo_output="$(lipo -info "$artifact_dir/libcronet_static.a")"
          echo "$lipo_output"
          echo "$lipo_output" | grep -Eiq "$expected"
          shasum -a 256 "$artifact_dir/libcronet_static.a" \
            | tee "$artifact_dir/SHA256SUMS.txt"

          {
            echo "naiveproxy revision: $(git -C "$NAIVE_ROOT" rev-parse HEAD)"
            echo "Chromium version: $(tr -d '\n' < "$NAIVE_ROOT/CHROMIUM_VERSION")"
            echo "Target OS: macos"
            echo "Target CPU: $TARGET_CPU"
            echo "Runner: $RUNNER"
            echo "GN target: //components/cronet:cronet_static"
            echo "Source library: $found"
            echo "Build mode: complete static library"
            echo "Build command: EXTRA_FLAGS=$EXTRA_FLAGS bash ./build.sh && ninja -C out/Release cronet_static"
          } > "$artifact_dir/build-info.txt"

      - name: Upload Cronet macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronet-macos-${{ matrix.arch }}-static
          path: cronet-artifact-macos-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
