name: Build modified Cronet Linux, OpenWrt and Windows (manual/release)

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-modified-cronet-multiplatform-releases
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: src

jobs:
  cache-toolchains-posix:
    name: Prepare Linux and OpenWrt toolchains
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout modified naiveproxy source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install POSIX build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            build-essential \
            bubblewrap \
            ca-certificates \
            ccache \
            curl \
            file \
            git \
            git-lfs \
            gnupg \
            gpgv \
            lsb-release \
            ninja-build \
            pkg-config \
            python3 \
            python3-requests \
            rsync \
            unzip \
            xz-utils \
            zip

      - name: Cache POSIX toolchains and host tools
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            src/chrome/build/pgo_profiles/
            src/.host_tool_cache/
            src/qemu-user*.deb
          key: cronet-posix-toolchain-${{ hashFiles('CHROMIUM_VERSION', 'src/DEPS') }}-v2

      - name: Prepare POSIX toolchain cache
        shell: bash
        working-directory: src
        run: |
          set -euxo pipefail
          chmod +x ./get-clang.sh ./get-sysroot.sh ./build.sh \
            ./build/linux/sysroot_scripts/generate_keyring.sh \
            ./build/linux/sysroot_scripts/sysroot_creator.py
          rm -f ./build/linux/sysroot_scripts/keyring.gpg
          GPG_TTY=/dev/null \
            bash ./build/linux/sysroot_scripts/generate_keyring.sh

          if ! compgen -G 'qemu-user*.deb' > /dev/null; then
            curl -fL \
              -o qemu-user_9.2.2+ds-1+b2_amd64.deb \
              https://snapshot.debian.org/archive/debian/20250405T083429Z/pool/main/q/qemu/qemu-user_9.2.2%2Bds-1%2Bb2_amd64.deb
          fi
          sudo apt-get remove -y qemu-user-binfmt || true
          sudo dpkg -i qemu-user*.deb
          sudo apt-get remove -y libc6-i386 || true

          EXTRA_FLAGS='target_cpu="x64"' bash ./get-clang.sh
          EXTRA_FLAGS='target_cpu="x64"' WARMUP_HOST_TOOLS=1 \
            bash ./build.sh

  cache-toolchains-win:
    name: Prepare Windows toolchains
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout modified naiveproxy source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Windows toolchains
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            src/chrome/build/pgo_profiles/
            ~/.cargo/bin/
            ~/bin/ninja.exe
          key: cronet-windows-toolchain-${{ hashFiles('CHROMIUM_VERSION', 'src/DEPS') }}-v2

      - name: Install Windows Ninja
        shell: bash
        working-directory: src
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          if [[ ! -f "$HOME/bin/ninja.exe" ]]; then
            curl -fsSL \
              -o "$HOME/bin/ninja-win.zip" \
              https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip
            unzip -o "$HOME/bin/ninja-win.zip" -d "$HOME/bin"
          fi
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          ninja.exe --version

      - name: Prepare Windows toolchain cache
        shell: bash
        working-directory: src
        run: |
          set -euxo pipefail
          chmod +x ./get-clang.sh ./get-sysroot.sh ./build.sh
          EXTRA_FLAGS='target_cpu="x64"' bash ./get-clang.sh
          EXTRA_FLAGS='target_cpu="x86"' bash ./get-clang.sh
          EXTRA_FLAGS='target_cpu="arm64"' bash ./get-clang.sh
          chmod +x ./gn/out/gn.exe \
            ./third_party/llvm-build/Release+Asserts/bin/clang-cl.exe
          ./gn/out/gn.exe --version
          ./third_party/llvm-build/Release+Asserts/bin/clang-cl.exe --version

  linux:
    needs: cache-toolchains-posix
    name: Build modified Cronet Linux ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64, arm, mipsel, mips64el, riscv64, loong64]
    env:
      EXTRA_FLAGS: 'target_cpu="${{ matrix.arch }}"'
      TARGET_OS: linux
      TARGET_CPU: ${{ matrix.arch }}
      NAIVE_ROOT: ..
      CHROMIUM_SRC: .
      OUT_DIR: out/Release
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout modified naiveproxy source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Linux build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            build-essential \
            ca-certificates \
            ccache \
            bubblewrap \
            curl \
            file \
            git \
            git-lfs \
            gnupg \
            gpgv \
            lsb-release \
            ninja-build \
            pkg-config \
            python3 \
            python3-requests \
            rsync \
            unzip \
            xz-utils \
            zip

      - name: Verify modified Cronet targets
        run: |
          set -euxo pipefail
          test -f "$NAIVE_ROOT/CHROMIUM_VERSION"
          test -f "$CHROMIUM_SRC/components/cronet/BUILD.gn"
          grep -Fq 'static_library("cronet_static")' \
            "$CHROMIUM_SRC/components/cronet/BUILD.gn"
          grep -Fq 'shared_library("cronet")' \
            "$CHROMIUM_SRC/components/cronet/BUILD.gn"
          git -C "$NAIVE_ROOT" rev-parse HEAD
          printf 'Chromium version: '
          tr -d '\n' < "$NAIVE_ROOT/CHROMIUM_VERSION"
          printf '\n'

      - name: Cache Linux toolchain and host tools
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            src/chrome/build/pgo_profiles/
            src/.host_tool_cache/
            src/qemu-user*.deb
          key: cronet-posix-toolchain-${{ hashFiles('CHROMIUM_VERSION', 'src/DEPS') }}-v2

      - name: Cache Linux sysroot
        uses: actions/cache@v4
        with:
          path: src/out/sysroot-build/
          key: cronet-linux-sysroot-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION', 'src/build/linux/sysroot_scripts/sysroot_creator.py') }}-v2

      - id: ccache-timestamp
        name: Create ccache cache key
        run: echo "CCACHE_TIMESTAMP=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Cache Linux compiler output
        uses: actions/cache@v4
        with:
          path: .ccache/
          key: cronet-linux-ccache-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION', 'src/DEPS', 'src/build.sh', 'src/components/cronet/BUILD.gn') }}-${{ steps.ccache-timestamp.outputs.CCACHE_TIMESTAMP }}
          restore-keys: |
            cronet-linux-ccache-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION', 'src/DEPS', 'src/build.sh', 'src/components/cronet/BUILD.gn') }}-

      - name: Download qemu-user helper for cross builds
        run: |
          set -euxo pipefail
          if ! compgen -G 'qemu-user*.deb' > /dev/null; then
            curl -fL \
              -o qemu-user_9.2.2+ds-1+b2_amd64.deb \
              https://snapshot.debian.org/archive/debian/20250405T083429Z/pool/main/q/qemu/qemu-user_9.2.2%2Bds-1%2Bb2_amd64.deb
          fi

          test -n "$(find . -maxdepth 1 -type f -name 'qemu-user*.deb' -print -quit)"

      - name: Install cross-build helpers
        run: |
          set -euxo pipefail
          sudo apt-get remove -y qemu-user-binfmt || true
          sudo dpkg -i qemu-user*.deb
          sudo apt-get remove -y libc6-i386 || true

      - name: Prepare Linux repository toolchain
        run: |
          set -euxo pipefail
          chmod +x ./get-clang.sh ./get-sysroot.sh ./build.sh \
            ./build/linux/sysroot_scripts/generate_keyring.sh \
            ./build/linux/sysroot_scripts/sysroot_creator.py
          rm -f ./build/linux/sysroot_scripts/keyring.gpg
          GPG_TTY=/dev/null \
            bash ./build/linux/sysroot_scripts/generate_keyring.sh
          bash ./get-clang.sh
          chmod +x ./gn/out/gn
          test -x ./gn/out/gn
          test -x ./third_party/llvm-build/Release+Asserts/bin/clang

      - name: Build modified Cronet Linux shared library
        run: |
          set -euxo pipefail
          ccache -z
          bash ./build.sh
          ninja -C "$OUT_DIR" cronet
          ccache -s

      - name: Package and validate Cronet Linux library
        run: |
          set -euxo pipefail
          artifact_dir="$NAIVE_ROOT/cronet-artifact"
          mkdir -p "$artifact_dir"

          found="$(find "$OUT_DIR" -type f \( \
            -name 'libcronet.so' -o \
            -name 'libcronet.*.so' -o \
            -name 'cronet.*.so' \
          \) -print -quit || true)"

          if [[ -z "$found" ]]; then
            echo 'ERROR: No Cronet Linux shared library was produced.'
            find "$OUT_DIR" -type f -name '*.so' -print | head -200 || true
            exit 1
          fi

          case "$TARGET_CPU" in
            x64) expected='ELF 64-bit.*x86-64' ;;
            x86) expected='ELF 32-bit.*(80386|Intel 80386)' ;;
            arm64) expected='ELF 64-bit.*(ARM aarch64|AArch64)' ;;
            arm) expected='ELF 32-bit.*ARM' ;;
            mipsel) expected='ELF 32-bit.*MIPS' ;;
            mips64el) expected='ELF 64-bit.*MIPS' ;;
            riscv64) expected='ELF 64-bit.*RISC-V' ;;
            loong64) expected='ELF 64-bit.*LoongArch' ;;
            *) echo "Unsupported Linux target CPU: $TARGET_CPU"; exit 1 ;;
          esac

          echo "Found: $found"
          cp -L "$found" "$artifact_dir/libcronet.so"
          cp -L "$OUT_DIR/args.gn" "$artifact_dir/args.gn"

          file_output="$(file "$artifact_dir/libcronet.so")"
          echo "$file_output"
          echo "$file_output" | grep -Eiq "$expected"
          readelf -h "$artifact_dir/libcronet.so"
          sha256sum "$artifact_dir/libcronet.so" \
            | tee "$artifact_dir/SHA256SUMS.txt"

          {
            echo "naiveproxy revision: $(git -C "$NAIVE_ROOT" rev-parse HEAD)"
            echo "Chromium version: $(tr -d '\n' < "$NAIVE_ROOT/CHROMIUM_VERSION")"
            echo "Target OS: linux"
            echo "Target CPU: $TARGET_CPU"
            echo "Runner: ubuntu-22.04"
            echo "GN target: //components/cronet:cronet"
            echo "Source library: $found"
            echo "Build command: EXTRA_FLAGS=$EXTRA_FLAGS bash ./build.sh && ninja -C out/Release cronet"
          } > "$artifact_dir/build-info.txt"

      - name: Upload Cronet Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-${{ matrix.arch }}
          path: cronet-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  openwrt:
    needs: cache-toolchains-posix
    name: Build modified Cronet OpenWrt ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            openwrt: "target=x86 subtarget=64"
            target_cpu: x64
          - arch: x86
            openwrt: "target=x86 subtarget=geode"
            target_cpu: x86
          - arch: aarch64_cortex-a53
            openwrt: "target=sunxi subtarget=cortexa53"
            target_cpu: arm64
            extra: 'arm_cpu="cortex-a53"'
          - arch: aarch64_cortex-a53-static
            openwrt: "target=sunxi subtarget=cortexa53"
            target_cpu: arm64
            # Cronet is linked as libcronet.so; static musl libc is not PIC.
            extra: 'arm_cpu="cortex-a53" build_static=false use_allocator_shim=false use_partition_alloc=false'
            openwrt_release: '24.10.0'
            openwrt_gcc_ver: '13.3.0'
          - arch: aarch64_cortex-a72
            openwrt: "target=mvebu subtarget=cortexa72"
            target_cpu: arm64
            extra: 'arm_cpu="cortex-a72"'
          - arch: aarch64_cortex-a72-static
            openwrt: "target=mvebu subtarget=cortexa72"
            target_cpu: arm64
            extra: 'arm_cpu="cortex-a72" build_static=false use_allocator_shim=false use_partition_alloc=false'
            openwrt_release: '24.10.0'
            openwrt_gcc_ver: '13.3.0'
          - arch: aarch64_cortex-a76
            openwrt: "target=bcm27xx subtarget=bcm2712"
            target_cpu: arm64
            extra: 'arm_cpu="cortex-a76"'
            openwrt_release: '24.10.0'
            openwrt_gcc_ver: '13.3.0'
          - arch: aarch64_generic
            openwrt: "target=layerscape subtarget=armv8_64b"
            target_cpu: arm64
          - arch: aarch64_generic-static
            openwrt: "target=layerscape subtarget=armv8_64b"
            target_cpu: arm64
            extra: "build_static=false use_allocator_shim=false use_partition_alloc=false"
            openwrt_release: '24.10.0'
            openwrt_gcc_ver: '13.3.0'
          - arch: arm_arm1176jzf-s_vfp
            openwrt: "target=brcm2708 subtarget=bcm2708"
            target_cpu: arm
            extra: 'arm_version=0 arm_cpu="arm1176jzf-s" arm_fpu="vfp" arm_float_abi="hard" arm_use_neon=false arm_use_thumb=false'
          - arch: arm_arm926ej-s
            openwrt: "target=mxs subtarget=generic"
            target_cpu: arm
            extra: 'arm_version=0 arm_cpu="arm926ej-s" arm_float_abi="soft" arm_use_neon=false arm_use_thumb=false'
          - arch: arm_cortex-a15_neon-vfpv4
            openwrt: "target=ipq806x subtarget=generic"
            target_cpu: arm
            extra: 'arm_version=0 arm_cpu="cortex-a15" arm_fpu="neon-vfpv4" arm_float_abi="hard" arm_use_neon=true'
          - arch: arm_cortex-a5_vfpv4
            openwrt: "target=at91 subtarget=sama5d3"
            target_cpu: arm
            extra: 'arm_version=0 arm_cpu="cortex-a5" arm_fpu="vfpv4" arm_float_abi="hard" arm_use_neon=false'
          - arch: arm_cortex-a7
            openwrt: "target=mediatek subtarget=mt7629"
            target_cpu: arm
            extra: 'arm_version=0 arm_cpu="cortex-a7" arm_float_abi="soft" arm_use_neon=false'
            openwrt_release: '21.02.0'
            openwrt_gcc_ver: '8.4.0'
          - arch: arm_cortex-a7_neon-vfpv4
            openwrt: "target=sunxi subtarget=cortexa7"
            target_cpu: arm
            extra: 'arm_version=0 arm_cpu="cortex-a7" arm_fpu="neon-vfpv4" arm_float_abi="hard" arm_use_neon=true'
          - arch: arm_cortex-a7_neon-vfpv4-static
            openwrt: "target=sunxi subtarget=cortexa7"
            target_cpu: arm
            extra: 'arm_version=0 arm_cpu="cortex-a7" arm_fpu="neon-vfpv4" arm_float_abi="hard" arm_use_neon=true build_static=false use_allocator_shim=false use_partition_alloc=false'
            openwrt_release: '24.10.0'
            openwrt_gcc_ver: '13.3.0'
          - arch: arm_cortex-a7_vfpv4
            openwrt: "target=at91 subtarget=sama7"
            target_cpu: arm
            extra: 'arm_version=0 arm_cpu="cortex-a7" arm_fpu="vfpv4" arm_float_abi="hard" arm_use_neon=false'
            openwrt_release: '22.03.0'
            openwrt_gcc_ver: '11.2.0'
          - arch: arm_cortex-a8_vfpv3
            openwrt: "target=sunxi subtarget=cortexa8"
            target_cpu: arm
            extra: 'arm_version=0 arm_cpu="cortex-a8" arm_fpu="vfpv3" arm_float_abi="hard" arm_use_neon=false'
          - arch: arm_cortex-a9
            openwrt: "target=bcm53xx subtarget=generic"
            target_cpu: arm
            extra: 'arm_version=0 arm_cpu="cortex-a9" arm_float_abi="soft" arm_use_neon=false'
          - arch: arm_cortex-a9-static
            openwrt: "target=bcm53xx subtarget=generic"
            target_cpu: arm
            extra: 'arm_version=0 arm_cpu="cortex-a9" arm_float_abi="soft" arm_use_neon=false build_static=false use_allocator_shim=false use_partition_alloc=false'
            openwrt_release: '24.10.0'
            openwrt_gcc_ver: '13.3.0'
          - arch: arm_cortex-a9_neon
            openwrt: "target=imx6 subtarget=generic"
            target_cpu: arm
            extra: 'arm_version=0 arm_cpu="cortex-a9" arm_fpu="neon" arm_float_abi="hard" arm_use_neon=true'
          - arch: arm_cortex-a9_vfpv3-d16
            openwrt: "target=mvebu subtarget=cortexa9"
            target_cpu: arm
            extra: 'arm_version=0 arm_cpu="cortex-a9" arm_fpu="vfpv3-d16" arm_float_abi="hard" arm_use_neon=false'
          - arch: arm_mpcore
            openwrt: "target=oxnas subtarget=ox820"
            target_cpu: arm
            extra: 'arm_version=0 arm_cpu="mpcore" arm_float_abi="soft" arm_use_neon=false arm_use_thumb=false'
          - arch: arm_xscale
            openwrt: "target=kirkwood subtarget=generic"
            target_cpu: arm
            extra: 'arm_version=0 arm_cpu="xscale" arm_float_abi="soft" arm_use_neon=false arm_use_thumb=false'
          - arch: mipsel_24kc
            openwrt: "target=ramips subtarget=rt305x"
            target_cpu: mipsel
            extra: 'mips_arch_variant="r2" mips_float_abi="soft"'
          - arch: mipsel_24kc-static
            openwrt: "target=ramips subtarget=rt305x"
            target_cpu: mipsel
            extra: 'mips_arch_variant="r2" mips_float_abi="soft" build_static=false use_allocator_shim=false use_partition_alloc=false'
            openwrt_release: '24.10.0'
            openwrt_gcc_ver: '13.3.0'
          - arch: mipsel_mips32
            openwrt: "target=brcm47xx subtarget=legacy"
            target_cpu: mipsel
            extra: 'mips_arch_variant="r1" mips_float_abi="soft"'
          - arch: riscv64
            openwrt: "target=sifiveu subtarget=generic"
            target_cpu: riscv64
            openwrt_release: '23.05.0'
            openwrt_gcc_ver: '12.3.0'
          - arch: loongarch64
            openwrt: "target=loongarch64 subtarget=generic"
            target_cpu: loong64
            openwrt_release: '24.10.0'
            openwrt_gcc_ver: '13.3.0'
    env:
      EXTRA_FLAGS: target_cpu="${{ matrix.target_cpu }}" target_os="openwrt" ${{ matrix.extra }}
      OPENWRT_FLAGS: arch=${{ matrix.arch }} release=${{ matrix.openwrt_release || '18.06.0' }} gcc_ver=${{ matrix.openwrt_gcc_ver || '7.3.0' }} ${{ matrix.openwrt }}
      TARGET_OS: openwrt
      TARGET_CPU: ${{ matrix.target_cpu }}
      TARGET_ARCH: ${{ matrix.arch }}
      NAIVE_ROOT: ..
      CHROMIUM_SRC: .
      OUT_DIR: out/Release
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout modified naiveproxy source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install OpenWrt build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            build-essential \
            bubblewrap \
            ca-certificates \
            ccache \
            curl \
            file \
            git \
            git-lfs \
            gnupg \
            gpgv \
            lsb-release \
            ninja-build \
            pkg-config \
            python3 \
            python3-requests \
            rsync \
            unzip \
            xz-utils \
            zip

      - name: Verify modified Cronet targets
        run: |
          set -euxo pipefail
          test -f "$NAIVE_ROOT/CHROMIUM_VERSION"
          test -f "$CHROMIUM_SRC/components/cronet/BUILD.gn"
          grep -Fq 'static_library("cronet_static")' \
            "$CHROMIUM_SRC/components/cronet/BUILD.gn"
          grep -Fq 'shared_library("cronet")' \
            "$CHROMIUM_SRC/components/cronet/BUILD.gn"
          git -C "$NAIVE_ROOT" rev-parse HEAD
          printf 'Chromium version: '
          tr -d '\n' < "$NAIVE_ROOT/CHROMIUM_VERSION"
          printf '\n'

      - name: Verify shared-library linker mode for static-named targets
        if: contains(matrix.arch, '-static')
        run: |
          set -euxo pipefail
          grep -Fq 'build_static=false' <<< "$EXTRA_FLAGS"
          ! grep -Fq 'build_static=true' <<< "$EXTRA_FLAGS"

      - name: Cache OpenWrt toolchain and host tools
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            src/chrome/build/pgo_profiles/
            src/.host_tool_cache/
            src/qemu-user*.deb
          key: cronet-posix-toolchain-${{ hashFiles('CHROMIUM_VERSION', 'src/DEPS') }}-v2

      - name: Cache OpenWrt sysroot
        uses: actions/cache@v4
        with:
          path: src/out/sysroot-build/openwrt/
          key: cronet-openwrt-sysroot-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION', 'src/get-openwrt.sh') }}-v2

      - id: ccache-timestamp
        name: Create ccache cache key
        run: echo "CCACHE_TIMESTAMP=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Cache OpenWrt compiler output
        uses: actions/cache@v4
        with:
          path: .ccache/
          key: cronet-openwrt-ccache-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION', 'src/DEPS', 'src/build.sh', 'src/components/cronet/BUILD.gn') }}-${{ steps.ccache-timestamp.outputs.CCACHE_TIMESTAMP }}
          restore-keys: |
            cronet-openwrt-ccache-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION', 'src/DEPS', 'src/build.sh', 'src/components/cronet/BUILD.gn') }}-

      - name: Download qemu-user helper for OpenWrt builds
        run: |
          set -euxo pipefail
          if ! compgen -G 'qemu-user*.deb' > /dev/null; then
            curl -fL \
              -o qemu-user_9.2.2+ds-1+b2_amd64.deb \
              https://snapshot.debian.org/archive/debian/20250405T083429Z/pool/main/q/qemu/qemu-user_9.2.2%2Bds-1%2Bb2_amd64.deb
          fi

          test -n "$(find . -maxdepth 1 -type f -name 'qemu-user*.deb' -print -quit)"

      - name: Install cross-build helpers
        run: |
          set -euxo pipefail
          sudo apt-get remove -y qemu-user-binfmt || true
          sudo dpkg -i qemu-user*.deb
          sudo apt-get remove -y libc6-i386 || true

      - name: Prepare OpenWrt repository toolchain
        run: |
          set -euxo pipefail
          chmod +x ./get-clang.sh ./get-sysroot.sh ./get-openwrt.sh ./build.sh
          bash ./get-clang.sh
          chmod +x ./gn/out/gn
          test -x ./gn/out/gn
          test -x ./third_party/llvm-build/Release+Asserts/bin/clang

      - name: Build modified Cronet OpenWrt shared library
        run: |
          set -euxo pipefail
          ccache -z
          bash ./build.sh
          ninja -C "$OUT_DIR" cronet
          ccache -s

      - name: Package and validate Cronet OpenWrt library
        run: |
          set -euxo pipefail
          artifact_dir="$NAIVE_ROOT/cronet-artifact"
          mkdir -p "$artifact_dir"

          found="$(find "$OUT_DIR" -type f \( \
            -name 'libcronet.so' -o \
            -name 'libcronet.*.so' -o \
            -name 'cronet.*.so' \
          \) -print -quit || true)"

          if [[ -z "$found" ]]; then
            echo 'ERROR: No Cronet OpenWrt shared library was produced.'
            find "$OUT_DIR" -type f -name '*.so' -print | head -200 || true
            exit 1
          fi

          case "$TARGET_CPU" in
            x64) expected='ELF 64-bit.*x86-64' ;;
            x86) expected='ELF 32-bit.*(80386|Intel 80386)' ;;
            arm64) expected='ELF 64-bit.*(ARM aarch64|AArch64)' ;;
            arm) expected='ELF 32-bit.*ARM' ;;
            mipsel) expected='ELF 32-bit.*MIPS' ;;
            riscv64) expected='ELF 64-bit.*RISC-V' ;;
            loong64) expected='ELF 64-bit.*LoongArch' ;;
            *) echo "Unsupported OpenWrt target CPU: $TARGET_CPU"; exit 1 ;;
          esac

          echo "Found: $found"
          cp -L "$found" "$artifact_dir/libcronet.so"
          cp -L "$OUT_DIR/args.gn" "$artifact_dir/args.gn"

          file_output="$(file "$artifact_dir/libcronet.so")"
          echo "$file_output"
          echo "$file_output" | grep -Eiq "$expected"
          readelf -h "$artifact_dir/libcronet.so"
          sha256sum "$artifact_dir/libcronet.so" \
            | tee "$artifact_dir/SHA256SUMS.txt"

          {
            echo "naiveproxy revision: $(git -C "$NAIVE_ROOT" rev-parse HEAD)"
            echo "Chromium version: $(tr -d '\n' < "$NAIVE_ROOT/CHROMIUM_VERSION")"
            echo "Target OS: $TARGET_OS"
            echo "Target CPU: $TARGET_CPU"
            echo "OpenWrt arch: $TARGET_ARCH"
            echo "OpenWrt flags: $OPENWRT_FLAGS"
            echo "Runner: ubuntu-22.04"
            echo "GN target: //components/cronet:cronet"
            echo "Source library: $found"
            echo "Build command: EXTRA_FLAGS=$EXTRA_FLAGS OPENWRT_FLAGS=$OPENWRT_FLAGS bash ./build.sh && ninja -C out/Release cronet"
          } > "$artifact_dir/build-info.txt"

      - name: Upload Cronet OpenWrt artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronet-openwrt-${{ matrix.arch }}
          path: cronet-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows:
    needs: cache-toolchains-win
    name: Build modified Cronet Windows ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    env:
      EXTRA_FLAGS: 'target_cpu="${{ matrix.arch }}"'
      TARGET_OS: win
      TARGET_CPU: ${{ matrix.arch }}
      NAIVE_ROOT: ..
      CHROMIUM_SRC: .
      OUT_DIR: out/Release

    steps:
      - name: Checkout modified naiveproxy source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Windows toolchain
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            src/chrome/build/pgo_profiles/
            ~/.cargo/bin/
            ~/bin/ninja.exe
          key: cronet-windows-toolchain-${{ hashFiles('CHROMIUM_VERSION', 'src/DEPS') }}-v2

      - name: Install Windows Ninja
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          if [[ ! -f "$HOME/bin/ninja.exe" ]]; then
            curl -fsSL \
              -o "$HOME/bin/ninja-win.zip" \
              https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip
            unzip -o "$HOME/bin/ninja-win.zip" -d "$HOME/bin"
          fi
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          ninja.exe --version

      - name: Verify modified Cronet targets
        run: |
          set -euxo pipefail
          test -f "$NAIVE_ROOT/CHROMIUM_VERSION"
          test -f "$CHROMIUM_SRC/components/cronet/BUILD.gn"
          grep -Fq 'static_library("cronet_static")' \
            "$CHROMIUM_SRC/components/cronet/BUILD.gn"
          grep -Fq 'shared_library("cronet")' \
            "$CHROMIUM_SRC/components/cronet/BUILD.gn"
          git -C "$NAIVE_ROOT" rev-parse HEAD
          printf 'Chromium version: '
          tr -d '\n' < "$NAIVE_ROOT/CHROMIUM_VERSION"
          printf '\n'

      - name: Prepare Windows repository toolchain
        run: |
          set -euxo pipefail
          chmod +x ./get-clang.sh ./get-sysroot.sh ./build.sh
          bash ./get-clang.sh
          chmod +x ./gn/out/gn.exe \
            ./third_party/llvm-build/Release+Asserts/bin/clang-cl.exe
          test -f ./gn/out/gn.exe
          test -f ./third_party/llvm-build/Release+Asserts/bin/clang-cl.exe
          ./gn/out/gn.exe --version
          ./third_party/llvm-build/Release+Asserts/bin/clang-cl.exe --version
          test -f "$HOME/.cargo/bin/sccache.exe"

      - name: Build modified Cronet Windows shared library
        run: |
          set -euxo pipefail
          export PATH="$HOME/bin:$PATH"
          "$HOME/.cargo/bin/sccache.exe" -z
          bash ./build.sh
          ninja.exe -C "$OUT_DIR" cronet
          "$HOME/.cargo/bin/sccache.exe" -s

      - name: Package and validate Cronet Windows library
        run: |
          set -euxo pipefail
          artifact_dir="$NAIVE_ROOT/cronet-artifact"
          mkdir -p "$artifact_dir"

          found="$(find "$OUT_DIR" -type f \( \
            -iname 'cronet.dll' -o \
            -iname 'libcronet.dll' -o \
            -iname 'cronet.*.dll' \
          \) -print -quit || true)"

          if [[ -z "$found" ]]; then
            echo 'ERROR: No Cronet Windows DLL was produced.'
            find "$OUT_DIR" -type f -iname '*.dll' -print | head -200 || true
            exit 1
          fi

          case "$TARGET_CPU" in
            x64) expected='PE32\+.*x86-64' ;;
            x86) expected='PE32.*(80386|i386|Intel 80386|Intel i386)' ;;
            arm64) expected='PE32\+.*(Aarch64|ARM64)' ;;
            *) echo "Unsupported Windows target CPU: $TARGET_CPU"; exit 1 ;;
          esac

          echo "Found: $found"
          cp -L "$found" "$artifact_dir/cronet.dll"
          cp -L "$OUT_DIR/args.gn" "$artifact_dir/args.gn"

          file_output="$(file "$artifact_dir/cronet.dll")"
          echo "$file_output"
          echo "$file_output" | grep -Eiq "$expected"
          sha256sum "$artifact_dir/cronet.dll" \
            | tee "$artifact_dir/SHA256SUMS.txt"

          {
            echo "naiveproxy revision: $(git -C "$NAIVE_ROOT" rev-parse HEAD)"
            echo "Chromium version: $(tr -d '\n' < "$NAIVE_ROOT/CHROMIUM_VERSION")"
            echo "Target OS: windows"
            echo "Target CPU: $TARGET_CPU"
            echo "Runner: windows-2022"
            echo "GN target: //components/cronet:cronet"
            echo "Source library: $found"
            echo "Build command: EXTRA_FLAGS=$EXTRA_FLAGS bash ./build.sh && ninja.exe -C out/Release cronet"
          } > "$artifact_dir/build-info.txt"

      - name: Upload Cronet Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronet-windows-${{ matrix.arch }}
          path: cronet-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
