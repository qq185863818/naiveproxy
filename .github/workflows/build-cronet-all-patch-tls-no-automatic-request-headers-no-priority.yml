          bash ./build.sh
          ninja -C "$OUT_DIR" cronet
          ccache -s

      - name: Package and validate patched TLS Cronet without automatic request headers and priority OpenWrt library
        run: |
          set -euxo pipefail
          artifact_dir="$NAIVE_ROOT/cronet-artifact"
          mkdir -p "$artifact_dir"

          found="$(find "$OUT_DIR" -type f \( \
            -name 'libcronet.so' -o \
