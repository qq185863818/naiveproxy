          restore-keys: |
            cronet-openwrt-patch-tls-no-automatic-request-headers-no-priority-ccache-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION', 'src/DEPS', 'src/build.sh', 'src/components/cronet/BUILD.gn', 'src/components/cronet/native/BUILD.gn', 'patches/cronet/cronet-v150-tls-order-trust-anchor-no-automatic-request-headers-no-priority.patch') }}-

      - name: Download qemu-user helper for OpenWrt builds
        run: |
